<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Pro</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: monospace;
            user-select: none; -webkit-user-select: none;
        }
        
        .camera-container {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .viewfinder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; display: flex; justify-content: center; align-items: center; z-index: 1;
        }
        .crosshair {
            width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.15);
            position: relative; border-radius: 4px;
        }

        /* HIGH TECH DATA REVEAL LAYER */
        #final-photo {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; 
            z-index: 10;
            pointer-events: none;
            color: #fff;
            padding: 30px;
            box-sizing: border-box;
        }
        
        .terminal-box {
            width: 100%;
            max-width: 320px;
            border: 1px solid #333;
            background: #050505;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            box-sizing: border-box;
            font-size: 13px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .system-green {
            color: #22c55e;
            font-weight: bold;
        }

        .top-ui {
            height: 60px; background: rgba(0,0,0,0.6); z-index: 20;
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            color: #aaa; font-size: 13px; letter-spacing: 1px;
        }
        .bottom-ui {
            height: 150px; background: #000; z-index: 20;
            display: flex; justify-content: center; align-items: center;
        }
        .shutter-ring {
            width: 76px; height: 76px; border-radius: 50%;
            border: 4px solid #fff; display: flex; justify-content: center; align-items: center;
            cursor: pointer; background: transparent;
        }
        .shutter-solid {
            width: 62px; height: 62px; border-radius: 50%; background: #fff;
        }

        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 30;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <div class="top-ui">
            <div>RAW</div>
            <div style="color:#eab308">● HDR</div>
            <div>1x</div>
        </div>

        <div class="viewfinder">
            <div class="crosshair"></div>
        </div>

        <!-- Terminal Output Reveal Screen -->
        <div id="final-photo">
            <div class="terminal-box">
                <div style="color: #666; margin-bottom: 10px;">[ SYSTEM LEVEL DEBUG ]</div>
                <div>EXPOSURE CAPTURE: <span class="system-green">SUCCESS</span></div>
                <div>METADATA CACHE: LOADED</div>
                <div>------------------------</div>
                <!-- MANUALLY CUSTOMIZE THESE VALUES BEFORE PERFORMING -->
                <div>TARGET: <span class="system-green">TODD KENT</span></div>
                <div>DOB AUTH: <span class="system-green">09/21/1971</span></div>
                <div>NODE VER: <span class="system-green">SUBARU_2017</span></div>
                <div>------------------------</div>
                <div>NFC PROXIMITY: ACTIVE</div>
                <div>DEBT COUPLING: COMPROMISED</div>
                <div style="margin-top: 15px; text-align: center; color: #dc2626; font-weight: bold; animation: blink 1s infinite;">● OPEN ACCESS GRANTED</div>
            </div>
        </div>

        <div id="flash"></div>

        <div class="bottom-ui">
            <div class="shutter-ring" id="capture-btn">
                <div class="shutter-solid"></div>
            </div>
        </div>
    </div>

    <script>
        const captureBtn = document.getElementById('capture-btn');
        const finalPhoto = document.getElementById('final-photo');
        const flash = document.getElementById('flash');

        captureBtn.addEventListener('click', () => {
            flash.style.opacity = '1';
            setTimeout(() => {
                flash.style.opacity = '0';
                flash.style.transition = 'opacity 0.2s ease-out';
                finalPhoto.style.opacity = '1';
            }, 60);
        });
    </script>
</body>
</html>
