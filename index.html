<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Pro</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, monospace;
            user-select: none; -webkit-user-select: none;
        }
        
        .camera-container {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .viewfinder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; display: flex; justify-content: center; align-items: center; z-index: 1;
        }
        .crosshair {
            width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.15);
            position: relative; border-radius: 4px;
        }

        /* METADATA DATABASE REVEAL PANEL */
        #final-photo {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; 
            z-index: 10;
            pointer-events: none;
            color: #fff;
            padding: 30px;
            box-sizing: border-box;
        }
        
        .database-card {
            width: 100%;
            max-width: 320px;
            border: 1px solid #3b82f6;
            background: #030712;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.25);
            box-sizing: border-box;
            font-size: 13px;
            line-height: 1.7;
        }

        .system-blue {
            color: #3b82f6;
            font-weight: bold;
        }

        .target-node-box {
            font-size: 24px;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            margin: 18px 0;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            padding: 12px 0;
        }

        .top-ui {
            height: 60px; background: rgba(0,0,0,0.6); z-index: 20;
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            color: #aaa; font-size: 13px; letter-spacing: 1px;
        }
        .bottom-ui {
            height: 150px; background: #000; z-index: 20;
            display: flex; justify-content: center; align-items: center;
        }
        .shutter-ring {
            width: 76px; height: 76px; border-radius: 50%;
            border: 4px solid #fff; display: flex; justify-content: center; align-items: center;
            cursor: pointer; background: transparent;
        }
        .shutter-solid {
            width: 62px; height: 62px; border-radius: 50%; background: #fff;
        }

        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 30;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <div class="top-ui">
            <div>RAW</div>
            <div style="color:#3b82f6">● CLOUD_SYNC</div>
            <div>1x</div>
        </div>

        <div class="viewfinder">
            <div class="crosshair"></div>
        </div>

        <!-- High-Tech Time-Delayed Output Screen -->
        <div id="final-photo">
            <div class="database-card">
                <div style="color: #555; font-size: 11px; margin-bottom: 8px;">[ SERVER METADATA RECON ]</div>
                <div>EXPOSURE CAPTURE: <span class="system-blue">SUCCESS</span></div>
                
                <!-- THE SECRET CLIMAX: This field forces a time completely independent of execution -->
                <div>REGISTRATION TIME: <span class="system-blue" id="delayed-timestamp">00:00:00</span></div>
                <div>EXPOSURE VERIFY: <span class="system-blue">COMPILED</span></div>
                
                <div class="target-node-box" id="target-output">GRAPHENE</div>
                
                <div style="font-size: 11px; text-align: center; color: #3b82f6; opacity: 0.8;">● HARDWARE EXPOSURE PRE-LOCKED</div>
            </div>
        </div>

        <div id="flash"></div>

        <div class="bottom-ui">
            <div class="shutter-ring" id="capture-btn">
                <div class="shutter-solid"></div>
            </div>
        </div>
    </div>

    <script>
        const captureBtn = document.getElementById('capture-btn');
        const finalPhoto = document.getElementById('final-photo');
        const flash = document.getElementById('flash');
        const delayedTimestamp = document.getElementById('delayed-timestamp');
        const targetOutput = document.getElementById('target-output');

        // 1. DYNAMIC SCRAPER: Pulls the forced item effortlessly from the URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const forceWord = urlParams.get('p');
        if (forceWord) {
            targetOutput.textContent = decodeURIComponent(forceWord).toUpperCase();
        }

        // 2. TIME-DELAY PARSER: Calculates an artificial 12-minute back-dated stamp instantly
        const currentTime = new Date();
        const delayedTime = new Date(currentTime.getTime() - (12 * 60 * 1000)); // Sets offset to exactly 12 minutes ago
        
        let hours = delayedTime.getHours();
        let minutes = delayedTime.getMinutes();
        let seconds = delayedTime.getSeconds();
        
        // Formatting padding
        hours = hours < 10 ? '0' + hours : hours;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;
        
        delayedTimestamp.textContent = `${hours}:${minutes}:${seconds} EST`;

        captureBtn.addEventListener('click', () => {
            flash.style.opacity = '1';
            setTimeout(() => {
                flash.style.opacity = '0';
                flash.style.transition = 'opacity 0.2s ease-out';
                finalPhoto.style.opacity = '1';
            }, 60);
        });
    </script>
</body>
</html>
