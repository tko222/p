<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Pro</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        
        .camera-container {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        
        #video {
            width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* REVEAL TEXT OVERLAY */
        #final-photo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; display: flex; justify-content: center; align-items: center;
            opacity: 0; z-index: 10; pointer-events: none;
        }
        
        .revealed-text {
            font-size: 34px;
            font-weight: 900;
            color: #000000; /* Bold black text looks like marker */
            letter-spacing: 4px;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
            background: rgba(255, 255, 255, 0.85); /* Box mimicking white card background */
            padding: 15px 35px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 80%;
            text-align: center;
            word-wrap: break-word;
        }

        /* UI Bars */
        .top-ui {
            height: 60px; background: rgba(0,0,0,0.4); z-index: 20; position: relative;
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            color: #aaa; font-size: 13px; letter-spacing: 1px;
        }
        .bottom-ui {
            height: 150px; background: rgba(0,0,0,0.8); z-index: 20; position: relative;
            display: flex; justify-content: center; align-items: center;
        }
        .shutter-ring {
            width: 76px; height: 76px; border-radius: 50%;
            border: 4px solid #fff; display: flex; justify-content: center; align-items: center;
            cursor: pointer; background: transparent;
        }
        .shutter-solid {
            width: 62px; height: 62px; border-radius: 50%; background: #fff;
        }
        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 30;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <!-- Top Status Bar -->
        <div class="top-ui">
            <div>RAW</div>
            <div style="color:#eab308" id="voice-status">● VOICE_READY</div>
            <div>1x</div>
        </div>

        <!-- Live Viewfinder Stream -->
        <video id="video" autoplay playsinline></video>

        <!-- Hidden Canvas for Spoken Text Reveal -->
        <div id="final-photo">
            <div class="revealed-text" id="target-output">MIND BLANK</div>
        </div>

        <!-- Flash Panel -->
        <div id="flash"></div>

        <!-- Shutter Button -->
        <div class="bottom-ui">
            <div class="shutter-ring" id="capture-btn">
                <div class="shutter-solid"></div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const captureBtn = document.getElementById('capture-btn');
        const finalPhoto = document.getElementById('final-photo');
        const flash = document.getElementById('flash');
        const targetOutput = document.getElementById('target-output');
        const voiceStatus = document.getElementById('voice-status');

        let capturedWord = "PALOMINO"; // Default backup fallback word

        // 1. HARDWARE CAMERA INITIALIZATION
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(s => { video.srcObject = s; })
                    .catch(e => console.log("Camera permissions denied."));
            });

        // 2. LIVE BACKGROUND VOICE-RECOGNITION ENGINE
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                // Grab the latest string of text parsed from the conversation
                const resultIndex = event.results.length - 1;
                const transcript = event.results[resultIndex][0].transcript.trim();
                
                // Split sentences into standalone words to find the target noun
                const words = transcript.split(' ');
                if (words.length > 0) {
                    const latestWord = words[words.length - 1].replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
                    if (latestWord.length > 2) {
                        capturedWord = latestWord.toUpperCase();
                        // Turn the indicator yellow briefly so you know it successfully caught the voice data
                        voiceStatus.style.color = '#eab308';
                        setTimeout(() => { voiceStatus.style.color = '#22c55e'; }, 400);
                    }
                }
            };

            // Keep the microphone listening indefinitely even if there are long pauses
            recognition.onend = () => { recognition.start(); };
            recognition.start();
            voiceStatus.style.color = '#22c55e';
        } else {
            voiceStatus.textContent = "● API_UNSUPPORTED";
            voiceStatus.style.color = '#dc2626';
        }

        // 3. SHUTTER SNAP REVEAL
        captureBtn.addEventListener('click', () => {
            targetOutput.textContent = capturedWord;
            
            // Trigger shutter flash animation
            flash.style.opacity = '1';
            setTimeout(() => {
                flash.style.opacity = '0';
                flash.style.transition = 'opacity 0.25s ease-out';
                
                // Freeze camera feed and drop down the written word reveal card
                try { video.pause(); } catch(e) {}
                finalPhoto.style.opacity = '1';
            }, 60);
        });
    </script>
</body>
</html>
