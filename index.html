<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Pro</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        
        .camera-container {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .viewfinder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; display: flex; justify-content: center; align-items: center; z-index: 1;
        }
        .crosshair {
            width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.15);
            position: relative; border-radius: 4px;
        }

        /* REVEAL LAYER */
        #final-photo {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; 
            display: flex; justify-content: center; align-items: center;
            opacity: 0; 
            z-index: 10;
            pointer-events: none;
        }
        
        /* 3D Hand holding the card perspective box */
        .hand-holding-scene {
            position: relative;
            width: 280px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Premium Playing Card Base */
        .card-graphic {
            width: 200px;
            height: 280px;
            background: #fffdf9;
            border-radius: 9px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: relative;
            padding: 10px;
            box-sizing: border-box;
            transform: rotate(-4deg); /* Natural holding angle */
        }

        /* Card Details */
        .index-top {
            position: absolute; top: 8px; left: 8px;
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Times New Roman', Times, serif; font-size: 24px; font-weight: bold; color: #cc1111; line-height: 0.9;
        }
        .index-bottom {
            position: absolute; bottom: 8px; right: 8px;
            display: flex; flex-direction: column; align-items: center; transform: rotate(180deg);
            font-family: 'Times New Roman', Times, serif; font-size: 24px; font-weight: bold; color: #cc1111; line-height: 0.9;
        }
        .index-pips { font-size: 16px; margin-top: 2px; }

        .card-center {
            position: absolute; top: 35px; bottom: 35px; left: 0; right: 0;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 15px 0; box-sizing: border-box;
        }
        
        .diamond-pip {
            width: 26px; height: 26px; background: #cc1111;
            transform: scaleX(0.75) rotate(45deg);
        }

        /* 3D Finger Overlay cutting across the edge of the card */
        .finger-thumb {
            position: absolute;
            width: 45px;
            height: 75px;
            background: linear-gradient(90deg, #e0a98c 0%, #f3cbb4 40%, #cca287 100%);
            border-radius: 20px 40px 40px 20px;
            bottom: 120px;
            left: 20px;
            transform: rotate(25deg);
            box-shadow: -5px 8px 15px rgba(0,0,0,0.4), inset 2px 2px 5px rgba(255,255,255,0.2);
            z-index: 15;
        }
        
        /* Subtle nail accent on the thumb for realistic depth */
        .finger-thumb::after {
            content: ''; position: absolute;
            width: 18px; height: 22px; background: rgba(255,255,255,0.25);
            border-radius: 5px 12px 12px 5px; top: 12px; right: 4px;
            border-right: 1px solid rgba(0,0,0,0.1);
        }

        .top-ui {
            height: 60px; background: rgba(0,0,0,0.6); z-index: 20;
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            color: #aaa; font-size: 13px; letter-spacing: 1px;
        }
        .bottom-ui {
            height: 150px; background: #000; z-index: 20;
            display: flex; justify-content: center; align-items: center;
        }
        .shutter-ring {
            width: 76px; height: 76px; border-radius: 50%;
            border: 4px solid #fff; display: flex; justify-content: center; align-items: center;
            cursor: pointer; background: transparent;
        }
        .shutter-solid {
            width: 62px; height: 62px; border-radius: 50%; background: #fff;
        }

        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 30;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <div class="top-ui">
            <div>RAW</div>
            <div style="color:#eab308">● HDR</div>
            <div>1x</div>
        </div>

        <div class="viewfinder">
            <div class="crosshair"></div>
        </div>

        <!-- Rendered Composition of Hand Holding Card -->
        <div id="final-photo">
            <div class="hand-holding-scene">
                <!-- The 3 of Diamonds Card -->
                <div class="card-graphic">
                    <div class="index-top">3<div class="index-pips">♦</div></div>
                    <div class="card-center">
                        <div class="diamond-pip"></div>
                        <div class="diamond-pip"></div>
                        <div class="diamond-pip"></div>
                    </div>
                    <div class="index-bottom">3<div class="index-pips">♦</div></div>
                </div>
                <!-- The overlapping thumb mask layer -->
                <div class="finger-thumb"></div>
            </div>
        </div>

        <div id="flash"></div>

        <div class="bottom-ui">
            <div class="shutter-ring" id="capture-btn">
                <div class="shutter-solid"></div>
            </div>
        </div>
    </div>

    <script>
        const captureBtn = document.getElementById('capture-btn');
        const finalPhoto = document.getElementById('final-photo');
        const flash = document.getElementById('flash');

        captureBtn.addEventListener('click', () => {
            flash.style.opacity = '1';
            setTimeout(() => {
                flash.style.opacity = '0';
                flash.style.transition = 'opacity 0.2s ease-out';
                finalPhoto.style.opacity = '1';
            }, 60);
        });
    </script>
</body>
</html>
