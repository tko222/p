<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        /* A convincing mock viewfinder background instead of a live stream */
        .viewfinder-bg {
            width: 100%; height: 100%; background: #111;
            display: flex; justify-content: center; align-items: center;
        }
        #reveal-photo {
            width: 100%; height: 100%; object-fit: cover; opacity: 0;
            transition: opacity 0.1s ease-in-out; position: absolute; top: 0; left: 0; z-index: 10;
        }
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none; z-index: 20;
        }
        .top-bar { height: 60px; background: rgba(0,0,0,0.5); }
        .bottom-bar {
            height: 140px; background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center; pointer-events: auto;
        }
        .shutter-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: white; border: 4px solid #000; box-shadow: 0 0 0 4px white; cursor: pointer;
        }
        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 30;
        }
    </style>
</head>
<body>

    <div class="viewfinder-bg">
        <!-- Clean, convincing dark grid look while aiming -->
        <div style="color: #333; font-size: 14px;">[ Loading Viewfinder... ]</div>
    </div>
    
    <!-- This is a high-quality photo of a card being revealed that drops in instantly -->
    <img id="reveal-photo" src="https://githubusercontent.com" alt="">
    
    <div id="flash"></div>

    <div class="ui-layer">
        <div class="top-bar"></div>
        <div class="bottom-bar" id="shutter-zone">
            <div class="shutter-btn"></div>
        </div>
    </div>

    <script>
        const shutterZone = document.getElementById('shutter-zone');
        const revealPhoto = document.getElementById('reveal-photo');
        const flash = document.getElementById('flash');

        shutterZone.addEventListener('click', () => {
            // Camera flash animation
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; flash.style.transition = 'opacity 0.2s ease'; }, 60);
            
            // Drop the image overlay instantly
            revealPhoto.style.opacity = '1'; 
        });
    </script>
</body>
</html>
