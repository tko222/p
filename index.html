<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #video {
            width: 100%; height: 100%; object-fit: cover; display: none;
        }
        #start-prompt {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #555; font-size: 70px; text-align: center; cursor: pointer; pointer-events: auto;
        }
        #card-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.35); 
            width: auto; height: 50%; opacity: 0;
            transition: opacity 0.05s ease-in-out; pointer-events: none; z-index: 10;
        }
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none; z-index: 20; display: none;
        }
        .top-bar { height: 60px; background: rgba(0,0,0,0.4); }
        .bottom-bar {
            height: 140px; background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center; pointer-events: auto;
        }
        .shutter-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: white; border: 4px solid #000; box-shadow: 0 0 0 4px white; cursor: pointer;
        }
        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 30;
        }
    </style>
</head>
<body>

    <div id="start-prompt">📷</div>

    <video id="video" autoplay playsinline></video>
    <img id="card-overlay" src="https://githubusercontent.com" alt="">
    <div id="flash"></div>

    <div class="ui-layer" id="controls">
        <div class="top-bar"></div>
        <div class="bottom-bar" id="shutter-zone">
            <div class="shutter-btn"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const startPrompt = document.getElementById('start-prompt');
        const controls = document.getElementById('controls');
        const shutterZone = document.getElementById('shutter-zone');
        const overlay = document.getElementById('card-overlay');
        const flash = document.getElementById('flash');

        startPrompt.addEventListener('click', async () => {
            startPrompt.style.display = 'none';
            video.style.display = 'block';
            controls.style.display = 'flex';

            // Crash Protection: Try running the camera, but don't break the page if it fails
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
            } catch (err) {
                console.log("Back camera blocked, trying fallback...");
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = fallbackStream;
                } catch (e) {
                    console.log("All camera streams blocked by device browser settings.");
                }
            }
        });

        shutterZone.addEventListener('click', () => {
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; flash.style.transition = 'opacity 0.2s ease'; }, 50);
            try { video.pause(); } catch(e) {}
            overlay.style.opacity = '0.95'; 
        });
    </script>
</body>
</html>
