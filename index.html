<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Pro</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        
        .camera-container {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .viewfinder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; display: flex; justify-content: center; align-items: center; z-index: 1;
        }
        .crosshair {
            width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.2);
            position: relative; border-radius: 4px;
        }

        /* FIXED REVEAL LAYOUT */
        #final-photo {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; 
            display: flex; justify-content: center; align-items: center;
            opacity: 0; 
            z-index: 10;
            pointer-events: none;
        }
        
        /* Enforcing white background on the card asset itself */
        #final-photo img {
            width: 60%; 
            height: auto;
            max-width: 300px;
            object-fit: contain;
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            padding: 4px;
        }

        .top-ui {
            height: 60px; background: rgba(0,0,0,0.6); z-index: 20;
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            color: #aaa; font-size: 13px; letter-spacing: 1px;
        }
        .bottom-ui {
            height: 150px; background: #000; z-index: 20;
            display: flex; justify-content: center; align-items: center;
        }
        .shutter-ring {
            width: 76px; height: 76px; border-radius: 50%;
            border: 4px solid #fff; display: flex; justify-content: center; align-items: center;
            cursor: pointer; background: transparent;
        }
        .shutter-solid {
            width: 62px; height: 62px; border-radius: 50%; background: #fff;
        }

        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 30;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <div class="top-ui">
            <div>RAW</div>
            <div style="color:#eab308">● HDR</div>
            <div>1x</div>
        </div>

        <div class="viewfinder">
            <div class="crosshair"></div>
        </div>

        <div id="final-photo">
            <!-- New ultra-reliable card graphic source -->
            <img src="https://githubusercontent.com" alt="3D">
        </div>

        <div id="flash"></div>

        <div class="bottom-ui">
            <div class="shutter-ring" id="capture-btn">
                <div class="shutter-solid"></div>
            </div>
        </div>
    </div>

    <script>
        const captureBtn = document.getElementById('capture-btn');
        const finalPhoto = document.getElementById('final-photo');
        const flash = document.getElementById('flash');

        captureBtn.addEventListener('click', () => {
            // Flash screen
            flash.style.opacity = '1';
            
            setTimeout(() => {
                flash.style.opacity = '0';
                flash.style.transition = 'opacity 0.2s ease-out';
                
                // Force display properties to trigger layout update instantly
                finalPhoto.style.opacity = '1';
            }, 60);
        });
    </script>
</body>
</html>
