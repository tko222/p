<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Pro</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        
        /* Realistic Mock Viewfinder Grids */
        .camera-container {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .viewfinder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; display: flex; justify-content: center; align-items: center; z-index: 1;
        }
        .crosshair {
            width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.2);
            position: relative; border-radius: 4px;
        }
        .crosshair::before {
            content: ''; position: absolute; top: 19px; left: -10px; width: 60px; height: 2px; background: rgba(255,255,255,0.1);
        }

        /* Final Captured Card Layout (3 of Diamonds) */
        #final-photo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #050505; display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.08s ease-in-out; z-index: 10;
        }
        #final-photo img {
            height: 55%; width: auto; max-width: 85%; object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
        }

        /* Control Bars */
        .top-ui {
            height: 60px; background: rgba(0,0,0,0.6); z-index: 20;
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            color: #aaa; font-size: 13px; letter-spacing: 1px;
        }
        .bottom-ui {
            height: 150px; background: #000; z-index: 20;
            display: flex; justify-content: center; align-items: center;
        }
        .shutter-ring {
            width: 76px; height: 76px; border-radius: 50%;
            border: 4px solid #fff; display: flex; justify-content: center; align-items: center;
            cursor: pointer; background: transparent;
        }
        .shutter-solid {
            width: 62px; height: 62px; border-radius: 50%; background: #fff;
            transition: transform 0.1s ease;
        }
        .shutter-ring:active .shutter-solid {
            transform: scale(0.9);
        }

        /* Flash Screen overlay */
        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 30;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <!-- System Top Bar -->
        <div class="top-ui">
            <div>RAW</div>
            <div style="color:#eab308">● HDR</div>
            <div>1x</div>
        </div>

        <!-- Viewfinder Center -->
        <div class="viewfinder">
            <div class="crosshair"></div>
        </div>

        <!-- The 3 of Diamonds Image Canvas -->
        <div id="final-photo">
            <img src="https://githubusercontent.com" alt="">
        </div>

        <!-- Screen Flash Panel -->
        <div id="flash"></div>

        <!-- Bottom Shutter Bar -->
        <div class="bottom-ui">
            <div class="shutter-ring" id="capture-btn">
                <div class="shutter-solid"></div>
            </div>
        </div>
    </div>

    <script>
        const captureBtn = document.getElementById('capture-btn');
        const finalPhoto = document.getElementById('final-photo');
        const flash = document.getElementById('flash');

        captureBtn.addEventListener('click', () => {
            // 1. Trigger realistic pure white flash
            flash.style.opacity = '1';
            
            setTimeout(() => {
                // 2. Hide flash smoothly
                flash.style.opacity = '0';
                flash.style.transition = 'opacity 0.25s ease-out';
                
                // 3. Drop in the 3 of Diamonds presentation screen instantly
                finalPhoto.style.opacity = '1';
            }, 60);
        });
    </script>
</body>
</html>
